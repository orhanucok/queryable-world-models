# env.yaml — PyBullet tabletop environment configuration.
#
# FROZEN constants (table geometry, Nmax, action scaling/clipping, query
# layout, normalization, label thresholds, episode length) live in
# qwm/data/schema.py and are NOT configurable here (never changed silently).
# This file holds only non-frozen knobs: resolution, physics substeps,
# camera, forces, spawn radius, default object count.

env:
  name: tabletop
  render: direct            # direct (headless) | gui (teleop debugging)

  obs:
    res: 84                # 84 default; 64 = documented low-memory fallback
    channels: 3

  physics:
    time_step: 0.0041667   # 1/240 s (informational; fixed in code)
    substeps_per_action: 20
    solver_iterations: 50

  camera:                  # fixed external camera (never moves)
    distance: 1.35
    yaw: 35.0
    pitch: -35.0
    target: [0.0, 0.0, 0.72]
    fov: 50.0

  objects:
    num_objects: 8         # STEP 3: configurable count, 1..Nmax(=20).
                           # Collection (collect.yaml) randomizes per episode;
                           # this default applies when nothing else is given.
    spawn_radius_xy: 0.33

  robot:
    max_velocity: 1.5
    force_xy: 500.0
    force_z: 300.0
    force_finger: 40.0
    home_xyz: [0.0, 0.0, 0.92]

  episode:
    length: 50             # informational; frozen as EPISODE_LENGTH in schema.py
