# train.yaml — shared by both models. Optimizer / overfit knobs are added
# in STEP 6. Sequence length and the split seed live here so the two models
# cannot drift.
seed: 0
device: auto
amp: true
data:
  dir: data/debug
  split_seed: 0
  sequence_length: 8
  batch_size: 8
  num_workers: 0
  image_norm: uint8_div_255   # only supported image normalization
train:
  data_dir: data              # 10k set; not data/debug
  sequence_length: 8
  batch_size: 16              # fall back to 8 on CUDA OOM; image size stays 84
  batch_size_fallback: 8
  steps: 2000                 # identical budget for QWM and latent-only
  val_every: 200
  log_every: 50
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  run_root: runs
overfit:
  num_sequences: 16           # frozen gate size
  sequence_length: 4
  steps: 200
  batch_size: 8
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  min_drop_ratio: 0.5         # final total must be <= half the initial total
